name: hopahead
x-app: &app
  build: .
  environment: &env
    DATABASE_URL: postgres://hopahead:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/hopahead
    KAFKA_BROKERS: kafka:9092
    SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
    PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:3000}
    MBTA_API_KEY: ${MBTA_API_KEY:-}
  depends_on:
    postgres: { condition: service_healthy }
    kafka: { condition: service_healthy }
  restart: unless-stopped
services:
  postgres:
    image: postgres:17.7-alpine
    environment:
      POSTGRES_USER: hopahead
      POSTGRES_DB: hopahead
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U hopahead -d hopahead']
      interval: 5s
      retries: 20
  kafka:
    image: apache/kafka:4.2.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,LOCAL://:19092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,LOCAL://127.0.0.1:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,LOCAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: '-Xmx512m -Xms256m'
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes: [kafka-data:/var/lib/kafka/data]
    healthcheck:
      test: [CMD-SHELL, '/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1']
      interval: 10s
      timeout: 10s
      retries: 20
  api:
    <<: *app
    command: [sh, -c, 'npm run migrate && npm run api']
    ports: ['127.0.0.1:3000:3000']
  collector:
    <<: *app
    command: [sh, -c, 'npm run migrate && npm run collector']
  worker:
    <<: *app
    command: [sh, -c, 'npm run migrate && npm run worker']
  relay:
    <<: *app
    command: [sh, -c, 'npm run migrate && npm run relay']
volumes:
  postgres-data:
  kafka-data:
